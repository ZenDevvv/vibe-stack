name: Validate template

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Bash syntax
        run: bash -n .template/setup.sh
      - name: Validate setup dry runs
        run: |
          for profile in motion frontend minimal custom; do
            bash .template/setup.sh --dry-run --design-profile "$profile" > /dev/null
          done
      - name: Reject machine-specific documentation links
        run: |
          matches=$(grep -rEl --include='*.md' --include='*.mdc' \
            'file:///|C:/Users/|c:/Users/' . || true)
          if [ -n "$matches" ]; then echo "$matches"; exit 1; fi
      - name: Validate project-truth structure
        run: bash .template/validate-project-truth.sh
